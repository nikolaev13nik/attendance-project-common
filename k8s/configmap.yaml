apiVersion: v1
kind: ConfigMap                          # NON-secret configuration, stored in plain text in the cluster
metadata:
  name: attendance-config                # Deployments reference this name to pull the values in
  namespace: attendance                  # must match namespace.yaml, or the object lands in "default"

data:                                    # every value is a string; these become env vars in the pods
  # --- shared by both services ---------------------------------------------
  SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver          # override the H2 driver in application.properties
  SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.PostgreSQLDialect

  # --- service-to-service address -------------------------------------------
  # "accounting" is the Kubernetes SERVICE name (Step 14), resolved by cluster DNS.
  # Same idea as Compose: service name + CONTAINER port, never localhost.
  ATTENDANCE_ACCOUNTING_BASE_URL: http://accounting:8080

  # --- messaging -------------------------------------------------------------
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092    # the internal listener; only pods use this

  # --- database host ---------------------------------------------------------
  # Each service appends its own ?currentSchema=... in its Deployment, so only
  # the host part is shared here.
  POSTGRES_HOST: postgres                # the Postgres Service name (Step 12)
  POSTGRES_PORT: "5432"                  # QUOTED: ConfigMap values must be strings, 5432 would be an int
