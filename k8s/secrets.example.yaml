# TEMPLATE ONLY - committed to git so the SHAPE of the secret is documented.
#
# Do NOT fill this in and apply it. A Kubernetes Secret stores values base64
# encoded, which is ENCODING, NOT ENCRYPTION - anyone who can read the file or
# run `kubectl get secret -o yaml` can decode it instantly:
#     echo 'cGFzc3dvcmQ=' | base64 -d
#
# Create the real secret from your .env instead, which never touches git:
#
#     kubectl create secret generic attendance-secrets \
#       --namespace attendance \
#       --from-env-file=../.env
#
# That reads JWT_SECRET, POSTGRES_PASSWORD, ACCOUNTING_DB_PASSWORD and
# TIMETRACKING_DB_PASSWORD straight out of .env and turns each into a key.

apiVersion: v1
kind: Secret
metadata:
  name: attendance-secrets
  namespace: attendance
type: Opaque                     # "Opaque" = arbitrary key/value pairs (vs. e.g. dockerconfigjson)

stringData:                      # stringData takes PLAIN text; k8s base64-encodes it for you
  JWT_SECRET: replace-me         # must be identical for both services, >= 32 bytes
  POSTGRES_PASSWORD: replace-me  # the Postgres superuser
  ACCOUNTING_DB_PASSWORD: replace-me
  TIMETRACKING_DB_PASSWORD: replace-me
