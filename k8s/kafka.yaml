# Kafka: single-node KRaft (no ZooKeeper), same as the Compose service.
# Two things differ from Compose and are commented in detail below:
#   1. the controller quorum voter address
#   2. volume ownership (securityContext)

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kafka-pvc
  namespace: attendance
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi                   # message log; plenty for a learning setup

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  namespace: attendance
spec:
  replicas: 1                        # single broker; scaling this needs a StatefulSet, not a Deployment
  strategy:
    type: Recreate                   # same ReadWriteOnce reasoning as Postgres

  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      securityContext:               # NOT needed in Compose - see notes
        runAsUser: 1000              # the image's "appuser"
        runAsGroup: 1000
        fsGroup: 1000                # kubelet chowns the mounted volume to this group

      containers:
        - name: kafka
          image: apache/kafka:4.3.1

          ports:
            - containerPort: 9092
              name: internal
            - containerPort: 9094
              name: external

          env:
            # --- node identity -------------------------------------------------
            - name: KAFKA_NODE_ID
              value: "1"                                   # QUOTED: env values must be strings
            - name: KAFKA_PROCESS_ROLES
              value: broker,controller                     # combined mode: one process does both

            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: 1@localhost:9093                      # <-- DIFFERS FROM COMPOSE. see notes
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: CONTROLLER

            # --- listeners: bind here, advertise these addresses ----------------
            - name: KAFKA_LISTENERS
              value: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
            - name: KAFKA_ADVERTISED_LISTENERS
              # "kafka" is the Service name below - how PODS reach the broker.
              # "localhost:9094" is for `kubectl port-forward` from your Mac.
              value: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: PLAINTEXT

            # --- single-node: Kafka defaults to 3 replicas and won't start -------
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
              value: "0"

            - name: KAFKA_LOG_DIRS
              value: /var/lib/kafka/data                   # matches the volumeMount below

            - name: KAFKA_HEAP_OPTS
              # The image default is -Xmx1G. With a 1Gi memory LIMIT the JVM would be
              # OOMKilled, because heap is only part of a JVM's footprint (metaspace,
              # thread stacks, direct byte buffers, GC structures all sit outside it).
              # Pin the heap well below the limit and leave headroom.
              value: "-Xmx768m -Xms256m"

          resources:
            requests:
              memory: "512Mi"        # measured idle usage was ~322Mi
              cpu: "200m"            # measured ~97m idle
            limits:
              memory: "1536Mi"       # 768m heap + JVM overhead + page cache headroom
              cpu: "1000m"           # 1 full core

          volumeMounts:
            - name: data
              mountPath: /var/lib/kafka/data

          # NOTE: an exec probe running kafka-topics.sh was tried first and FAILED -
          # that script boots a whole JVM and takes 10-15s on this machine, so every
          # probe timed out and the liveness probe kept restarting a healthy broker.
          # A TCP probe costs nothing: the kubelet just opens a socket.

          readinessProbe:
            tcpSocket:
              port: 9092               # is the broker listener accepting connections?
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3

          livenessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 120   # far later than readiness - never restart a merely-slow broker
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3        # 3 consecutive failures (90s) before restarting

      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: kafka-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: kafka                          # the DNS name pods use, and the value in attendance-config
  namespace: attendance
spec:
  type: ClusterIP
  selector:
    app: kafka
  ports:
    - name: internal
      port: 9092
      targetPort: 9092
    - name: external                   # only used via `kubectl port-forward`
      port: 9094
      targetPort: 9094
