# Ingress: ONE entry point for both HTTP services.
#
# Replaces the per-service host ports you had in Compose:
#   Compose:     localhost:8081 -> accounting     localhost:8082 -> timetracking
#   Kubernetes:  attendance.local/account/...     attendance.local/attendance/...
#
# Requires one line in /etc/hosts on your Mac:
#   127.0.0.1  attendance.local
#
# Traefik already listens on localhost:80 (it ships with k3s), so nothing else
# needs installing and no port-forward or kubefwd is involved for HTTP.

apiVersion: networking.k8s.io/v1      # Ingress lives in the networking group, not core v1
kind: Ingress
metadata:
  name: attendance
  namespace: attendance
spec:
  ingressClassName: traefik           # which controller handles this; "traefik" is k3s's default

  rules:
    - host: attendance.local          # only requests with this Host header match this rule
      http:
        paths:
          # --- Accounting -------------------------------------------------
          - path: /account            # every URL of the Accounting API starts with /account
            pathType: Prefix          # Prefix = /account and everything below it
            backend:
              service:
                name: accounting      # the Service created in Attendance-Accounting/k8s/
                port:
                  number: 8080        # the SERVICE port, not the host port

          # --- TimeTracking -----------------------------------------------
          - path: /attendance         # every URL of the TimeTracking API starts with /attendance
            pathType: Prefix
            backend:
              service:
                name: timetracking
                port:
                  number: 8080

# NOTE: no path rewriting. The apps already expect /account/... and
# /attendance/... at their root, so Traefik passes the path through unchanged.
# If the prefixes ever collided with the app's own routes you would need a
# Traefik Middleware (stripPrefix) - not required here.
#
# DELIBERATELY NOT EXPOSED: /actuator/health. Probes reach it inside the cluster;
# there is no reason to publish it.
