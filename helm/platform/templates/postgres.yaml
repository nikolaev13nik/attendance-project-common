{{- /*
  The ENTIRE file is wrapped in postgres.enabled.
  On AWS: --set postgres.enabled=false and none of this renders, because RDS
  replaces it. Only config.postgresHost changes for the services.
*/ -}}
{{- if .Values.postgres.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: {{ .Values.namespace.name }}
data:
  # .Files.Get reads a file from INSIDE the chart directory. This replaces the
  # manual `kubectl create configmap postgres-init --from-file=init-db.sh`.
  # indent 8 lines it up under the YAML block scalar below; get it wrong and the
  # rendered YAML is invalid.
  init-db.sh: |
{{ .Files.Get "files/init-db.sh" | indent 8 }}

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: {{ .Values.namespace.name }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.postgres.persistence.size }}
  {{- /* Only emit storageClassName when a value is set. "" means "cluster default"
         (local-path on k3s, gp3 on EKS) - and emitting an empty string would be
         wrong, so the field must be absent rather than blank. */}}
  {{- with .Values.postgres.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: {{ .Values.namespace.name }}
spec:
  replicas: 1                        # never more than 1: they would fight over the volume
  strategy:
    type: Recreate                   # kill before create; RollingUpdate deadlocks on ReadWriteOnce
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}

          ports:
            - containerPort: 5432

          env:
            - name: POSTGRES_USER
              value: {{ .Values.postgres.user }}
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata   # subdirectory: initdb refuses a non-empty mount root

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: POSTGRES_PASSWORD
            - name: ACCOUNTING_DB_PASSWORD           # consumed by init-db.sh, not by Postgres
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: ACCOUNTING_DB_PASSWORD
            - name: TIMETRACKING_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: TIMETRACKING_DB_PASSWORD

          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d

          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}

          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U {{ .Values.postgres.user }}"]
            initialDelaySeconds: 5
            periodSeconds: 5

          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U {{ .Values.postgres.user }}"]
            initialDelaySeconds: 30
            periodSeconds: 10

      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-pvc
        - name: init
          configMap:
            name: postgres-init
            defaultMode: 0755

---
apiVersion: v1
kind: Service
metadata:
  # Must equal config.postgresHost, or the services cannot resolve the database.
  name: {{ .Values.config.postgresHost }}
  namespace: {{ .Values.namespace.name }}
spec:
  type: ClusterIP
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
{{- end }}
