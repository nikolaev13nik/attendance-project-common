{{- if and .Values.ingress.enabled .Values.ingress.signupLimit.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: attendance-signup
  namespace: {{ .Values.namespace.name }}
  annotations:
    nginx.ingress.kubernetes.io/limit-rpm: {{ .Values.ingress.signupLimit.perMinute | quote }}
    nginx.ingress.kubernetes.io/limit-burst-multiplier: {{ .Values.ingress.signupLimit.burstMultiplier | quote }}
spec:
  ingressClassName: {{ .Values.ingress.className }}

  {{- if and .Values.ingress.tls .Values.ingress.host }}
  tls:
    - hosts:
        - {{ .Values.ingress.host }}
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}

  rules:
    - http:
        paths:
          - path: /account/signup
            pathType: Exact
            backend:
              service:
                name: accounting
                port:
                  number: 8080

      {{- with .Values.ingress.host }}
      host: {{ . }}
      {{- end }}
{{- end }}
