apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aiassistance
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/nikolaev13nik/Attendance-AI-Assistance.git
    targetRevision: main
    path: helm/aiassistance

  destination:
    server: https://kubernetes.default.svc
    namespace: attendance

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
