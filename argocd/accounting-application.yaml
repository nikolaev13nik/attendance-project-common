apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: accounting
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/nikolaev13nik/Attendance-Accounting.git

    targetRevision: main

    path: helm/accounting

  destination:
    server: https://kubernetes.default.svc
    namespace: attendance

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
