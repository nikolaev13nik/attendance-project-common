services:

  postgres:
    image: postgres:16-alpine
    container_name: attendance-postgres
    restart: "no"

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      ACCOUNTING_DB_PASSWORD: ${ACCOUNTING_DB_PASSWORD}
      TIMETRACKING_DB_PASSWORD: ${TIMETRACKING_DB_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./helm/platform/files/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  kafka:
    image: apache/kafka:4.3.1
    container_name: attendance-kafka
    restart: "no"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      KAFKA_LOG_DIRS: /var/lib/kafka/data

    ports:
      - "9094:9094"

    volumes:
      - kafkadata:/var/lib/kafka/data

    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  accounting:
    build:
      context: ../Attendance-Accounting
      dockerfile: Dockerfile.dev
    image: accounting:local
    container_name: attendance-accounting
    restart: "no"

    environment:
      ATTENDANCE_ACCOUNTING_JWT_SECRET: ${JWT_SECRET}
      ATTENDANCE_ACCOUNTING_BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/attendance?currentSchema=accounting
      SPRING_DATASOURCE_USERNAME: accounting_user
      SPRING_DATASOURCE_PASSWORD: ${ACCOUNTING_DB_PASSWORD}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.PostgreSQLDialect

    ports:
      - "8081:8080"

    depends_on:
      postgres:
        condition: service_healthy

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  timetracking:
    build:
      context: ../Attendance-TimeTracking
      dockerfile: Dockerfile.dev
    image: timetracking:local
    container_name: attendance-timetracking
    restart: "no"

    environment:
      ATTENDANCE_ACCOUNTING_JWT_SECRET: ${JWT_SECRET}

      ATTENDANCE_ACCOUNTING_BASE_URL: http://accounting:8080

      KAFKA_BOOTSTRAP_SERVERS: kafka:9092

      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/attendance?currentSchema=timetracking
      SPRING_DATASOURCE_USERNAME: timetracking_user
      SPRING_DATASOURCE_PASSWORD: ${TIMETRACKING_DB_PASSWORD}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.PostgreSQLDialect

    ports:
      - "8082:8080"

    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      accounting:
        condition: service_healthy

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  aiassistance:
    build:
      context: ../Attendance-AI-Assistance
      dockerfile: Dockerfile.dev
    image: aiassistance:local
    container_name: attendance-aiassistance
    restart: "no"

    environment:
      # The only platform value it needs. No database and no JWT secret: this service has no API to
      # protect and no rows to store - it reads one Kafka topic and sends mail.
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092

      # Defaults with ":-" so the stack comes up without SMTP configured. MAIL_ENABLED=false means the
      # pipeline runs end to end and logs the analysis instead of sending it.
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-no-reply@attendance.local}

      # No ":-" default, unlike the MAIL_* values above. A missing SMTP config is a degraded mode this
      # service is built for; a missing API key is not - every analysis call would fail at runtime.
      # Leaving it undefaulted makes Compose warn at "up" time instead of starting a container that
      # only fails once the first report arrives.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}

    # 8083 continues the sequence: 8081 accounting, 8082 timetracking. Only /actuator/health answers here.
    ports:
      - "8083:8080"

    # Kafka only. It does not depend on timetracking: the topic decouples them, so either can start first.
    depends_on:
      kafka:
        condition: service_healthy

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

volumes:
  pgdata:
  kafkadata:
